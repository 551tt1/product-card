<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
  <title>Каталог товаров</title>
</head>

<body>
  <div class="all-elements bg-img-dandelions">
    <h1 class="product-selection__title">Выбери свой продукт</h1>
    <div class="buttons">
      <button id="recolor-first-card-button">Покрасить первую карточку</button>
      <button id="recolor-cards-button">Покрасить все карточки</button>
      <button id="open-google-button">Открыть Google</button>
      <button id="self-recolor-button">Покрасить кнопку</button>
    </div>


    <div class="product-card-wrapper"></div>

    <template id="product-card-template">
      <div class="product-card">
        <img class="product-card__img" src alt>
        <p class="product-card__for-skin"></p>
        <h3 class="product-card__title"></h3>
        <p class="product-card__descr">.</p>
        <ul class="product-card__components" type="circle"></ul>
        <span class="product-card__price"></span>
        <span class="product-card__price-value"></span>
      </div>
    </template>
  </div>
</body>

<script src="js/script.js"></script>
<script src="js/homework-5.js"></script>
<script src="js/homework-6.js"></script>
<script src="js/homework-7.js" type="module"></script>
<script src="js/homework-8.js" type="module"></script>

</html>
